<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Nano Banana 浮水印移除工具</title>
    <meta name="description" content="使用 Reverse Alpha Blending 技術移除 Nano Banana 浮水印的純前端工具">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta property="og:image" content="assets/og.png">
    <meta property="og:title" content="Gemini Nano Banana 浮水印移除工具">
    <meta property="og:description" content="使用 Reverse Alpha Blending 技術移除 Nano Banana 浮水印的純前端工具">
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f5c842">
    <link rel="apple-touch-icon" href="assets/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
    <div class="app-container">
        <!-- Header Nav -->
        <nav class="header-nav">
            <button class="nav-link theme-toggle" id="themeToggle" title="切換主題">
                <svg class="theme-icon sun" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>
                </svg>
                <svg class="theme-icon moon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>
                </svg>
            </button>
        </nav>

        <header class="header">
            <h1 class="title">
                <span class="title-icon">🍌</span>
                Gemini Nano Banana 浮水印移除工具
            </h1>
            <p class="subtitle">使用 Reverse Alpha Blending 技術 <strong>無損</strong>移除浮水印· 純前端計算</p>
        </header>

        <main class="main-content">
            <!-- Drop Zone -->
            <div class="drop-zone" id="dropZone">
                <div class="drop-zone-content">
                    <div class="drop-icon">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                    </div>
                    <p class="drop-text">拖放圖片到這裡，或點擊選擇檔案</p>
                    <p class="drop-hint">支援 PNG、JPG 格式，可批次上傳</p>
                    <input type="file" id="fileInput" accept="image/png,image/jpeg" multiple hidden>
                </div>
            </div>

            <!-- Usage Steps -->
            <div class="usage-steps">
                <div class="step">
                    <div class="step-number">1</div>
                    <div class="step-content">
                        <div class="step-title">上傳圖片</div>
                        <div class="step-desc">拖放或點擊選擇帶有浮水印的圖片</div>
                    </div>
                </div>
                <div class="step-arrow">→</div>
                <div class="step">
                    <div class="step-number">2</div>
                    <div class="step-content">
                        <div class="step-title">自動處理</div>
                        <div class="step-desc">系統自動偵測並移除浮水印</div>
                    </div>
                </div>
                <div class="step-arrow">→</div>
                <div class="step">
                    <div class="step-number">3</div>
                    <div class="step-content">
                        <div class="step-title">下載結果</div>
                        <div class="step-desc">預覽並下載處理完成的圖片</div>
                    </div>
                </div>
            </div>

            <!-- Processing Status -->
            <div class="status-bar" id="statusBar" hidden>
                <div class="status-info">
                    <span class="status-text" id="statusText">處理中...</span>
                    <span class="status-count" id="statusCount">0 / 0</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <!-- Results Grid -->
            <div class="results-section" id="resultsSection" hidden>
                <div class="results-header">
                    <h2 class="results-title">處理結果</h2>
                    <div class="results-actions">
                        <button class="btn btn-secondary" id="clearBtn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="3 6 5 6 21 6"/>
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                            </svg>
                            清除全部
                        </button>
                        <button class="btn btn-primary" id="downloadAllBtn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="7 10 12 15 17 10"/>
                                <line x1="12" y1="15" x2="12" y2="3"/>
                            </svg>
                            下載全部
                        </button>
                    </div>
                </div>
                <div class="results-grid" id="resultsGrid"></div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-privacy">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                所有處理皆在瀏覽器本地完成，圖片不會上傳至伺服器
            </div>
        </footer>
    </div>

    <!-- Image Lightbox -->
    <div class="lightbox-overlay" id="lightbox" hidden>
        <div class="lightbox-content">
            <button class="lightbox-close" id="lightboxClose">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
            <div class="lightbox-image-container" id="lightboxImageContainer">
                <img src="" alt="" class="lightbox-image" id="lightboxImage">
                <div class="lightbox-hint" id="lightboxHint">點擊圖片切換 原圖 / 處理後</div>
            </div>
            <div class="lightbox-info">
                <div class="lightbox-filename" id="lightboxFilename"></div>
                <div class="lightbox-toggle">
                    <button class="toggle-btn active" id="toggleProcessed">處理後</button>
                    <button class="toggle-btn" id="toggleOriginal">原圖</button>
                </div>
            </div>
            <div class="lightbox-nav">
                <button class="lightbox-nav-btn" id="lightboxPrev">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="15 18 9 12 15 6"/>
                    </svg>
                </button>
                <button class="lightbox-nav-btn" id="lightboxNext">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" integrity="sha512-XMVd28F1oH/O71fzwBnV7HucLxVwtxf26XV8P4wPk26EDxuGZ91N8bsOttmnomcCD3CS5ZMRL50H0GgOHvegtg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="app.js"></script>
</body>
</html>
